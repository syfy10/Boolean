name: Tests

on:
  push:
    branches-ignore:
      - "gh-pages"
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the UI bundle parses
        run: node test/ui-syntax-check.cjs

      - name: Run the test suite
        run: npm test

      - name: Check the release version is in sync
        run: node build/set-version.mjs --check
